<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Hi student , Welcome to Apna College!</h1>
    <p>You can sign up to the platform to access all important notes & lectures.</p>

    <form action="/addUser" method="POST" target="_blank" id="signupForm">
<div class="field">
    <label for="email" class="email">Email:</label>
    <input type="text" placeholder="name@email.com" name="email" id="email" required>
</div>

<div class="field">
    <label for="username" class="username">Username:</label>
    <input type="text" placeholder="username" name="username" id="username" required>
</div>

<div class="field">
    <label for="password" class="password">Password:</label>
    <input type="password" placeholder="password" name="password" id="password" required>
</div>

<button class="formBtn">Create Account</button>
    </form>
</body>
</html>
